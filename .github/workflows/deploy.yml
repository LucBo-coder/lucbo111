name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Public game server for the online world (repository variable SERVER_URL, e.g. wss://game.example.com/ws).
          # Empty: the online world connects to a server on the player's own computer (ws://localhost:8787/ws).
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - run: npm run server:typecheck
      - run: npm test

      - name: Push dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
